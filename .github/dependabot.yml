version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Minor and patch updates arrive grouped; each major update gets its own PR, since those need migration work.
    groups:
      production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # selfsigned 3+ only generates certificates asynchronously, but the local server must know its port before
      # Electron is ready so host-rules can point discord.com at it. Stay on v2 until that startup order changes.
      - dependency-name: "selfsigned"
        update-types: ["version-update:semver-major"]
